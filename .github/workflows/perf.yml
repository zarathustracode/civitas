name: perf

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/perf.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/perf.yml"

# The performance budget. The API's read endpoints must keep P99 under
# 50 ms (backend/perf/reads.js); the production frontend must hold the
# Lighthouse scores, JavaScript size and layout stability set in
# frontend/lighthouserc.cjs. Either failing fails the job.

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  budget:
    name: API P99 + Lighthouse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civitas
          POSTGRES_PASSWORD: civitas
          POSTGRES_DB: civitas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civitas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://civitas:civitas@localhost:5432/civitas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # Latency budgets only mean something against an optimized build.
      - name: Build the API (release)
        working-directory: backend
        run: cargo build --release -p civitas-api --bins

      - name: Seed the database
        working-directory: backend
        run: ./target/release/seed

      - name: Start the API
        working-directory: backend
        env:
          PUBLIC_BASE_URL: http://127.0.0.1:5173
          SMTP_FROM: "Civitas <noreply@localhost>"
          COOKIE_SECURE: "false"
          RUST_LOG: civitas=warn
          # One load generator on one address; the limiter is not under test.
          RATE_LIMIT_AUTH_BURST: "1000"
          RATE_LIMIT_GLOBAL_BURST: "100000"
          RATE_LIMIT_GLOBAL_REPLENISH_MS: "1"
        run: |
          nohup ./target/release/civitas-api > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - uses: grafana/setup-k6-action@v1
      - name: API read-path P99
        run: k6 run backend/perf/reads.js

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Lighthouse
        working-directory: frontend
        run: |
          LHCI_PROPOSAL_ID=$(curl -sf "http://127.0.0.1:8080/proposals?status=voting" \
            | jq -r 'map(select(.title == "Open the demo voting window"))[0].id')
          export LHCI_PROPOSAL_ID
          pnpm lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-api-log
          path: ${{ runner.temp }}/api.log
          retention-days: 7
